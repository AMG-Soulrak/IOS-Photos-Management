name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    # WPF y WPD exigen Windows. No usa el SDK portable de la carpeta del proyecto: lo instala setup-dotnet.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Barandilla (ADR-0001): la app solo lee del dispositivo. Falla si reaparece código que borre o escriba en el iPhone.
      - name: Comprobar que no hay borrado en el iPhone
        shell: pwsh
        run: |
          $hits = git grep -I -nE "DeleteFile|DeleteDirectory|afc_remove_path|afc_rename_path|GenericWrite|GenericAll|Delete\(RemoteFile|SupportsDelete|CanDelete" -- "src/*.cs"
          if ($hits) { $hits; Write-Error "Solo lectura del dispositivo (ADR-0001): retira ese código."; exit 1 }
          "Sin código de borrado en el dispositivo."

      - name: Compilar
        run: dotnet build IPhonePhotos.sln -c Release

      - name: Pruebas (sin las de rendimiento)
        run: dotnet test tests/IPhonePhotos.Tests -c Release --no-build --filter "Category!=Perf"

      # Falla si hay paquetes con avisos de seguridad (directos o transitivos). dotnet list sale con 0 aunque los haya,
      # así que se mira la salida; también falla si la consulta no se pudo hacer (sin fuente de avisos).
      - name: Paquetes con vulnerabilidades conocidas
        shell: pwsh
        run: |
          $out = dotnet list IPhonePhotos.sln package --vulnerable --include-transitive 2>&1 | Out-String
          $out
          if ($LASTEXITCODE -ne 0) { Write-Error "No se pudo comprobar las vulnerabilidades."; exit 1 }
          if ($out -match "(?im)has the following vulnerable packages|tiene los siguientes paquetes vulnerables|^\s*>\s") {
            Write-Error "Hay paquetes con vulnerabilidades conocidas: actualízalos."; exit 1 }
